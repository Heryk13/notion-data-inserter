[project]
name = "scraper-notion"
version = "0.1.0"
description = "Importador de dados Excel para databases do Notion"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "questionary>=2.1.1",
    "requests>=2.34.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
